apiVersion: v1
kind: Pod
metadata:
  labels:
    run: logger
  name: logger
  namespace: exercise-02
spec:
  initContainers:
    - image: busybox:1.36
      name: log-agent
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /var/log/app/app.log "]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
  containers:
  - image: busybox:1.36
    name: app
    command: ['sh', '-c', 'while true; do echo "logging" >> /var/log/app/app.log; sleep 3; done']
    volumeMounts:
      - name: log-volume
        mountPath: /var/log/app
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
    - name: log-volume
      emptyDir: {}
status: {}
