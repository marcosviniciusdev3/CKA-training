apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv-1
  namespace: exercise-25
spec:
  storageClassName: "local-storage"
  accessModes:
    - ReadWriteOnce
  local:
    path: /mnt/data
  capacity:
    storage: 1Gi
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cka-worker # Replace if your node name is different
