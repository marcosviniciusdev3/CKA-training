apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: exercise-03
spec:
  volumes:
    - name: config-volume
      configMap:
        name: app-config
  containers:
  - image: busybox:1.36
    name: app
    command: ["sh", "-c", "sleep 3600"]
    resources: {}
    volumeMounts:
      - name: config-volume
        mountPath: /etc/config
    envFrom:
      - configMapRef:
          name: app-config
    env: 
      - name: DB_USER 
        valueFrom:
          secretKeyRef:
            name:  db-creds
            key: DB_USER
      - name: DB_PASS 
        valueFrom:
          secretKeyRef:
            name:  db-creds
            key: DB_PASS
  dnsPolicy: ClusterFirst
  restartPolicy: Always
