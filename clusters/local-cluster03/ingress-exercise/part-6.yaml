apiVersion: v1
kind: Namespace
metadata:
  name: broken-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-content
  namespace: broken-app
data:
  index.html: |
    <h1>Shop is up</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: broken-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: shop-content
---
apiVersion: v1
kind: Service
metadata:
  name: shop-svc
  namespace: broken-app
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: broken-app
spec:
  ingressClassName: nginx
  rules:
    - host: shop.cka.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-svc
                port:
                  number: 80
