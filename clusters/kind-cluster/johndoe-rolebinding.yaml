apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: johndoe-rolebinding
  namespace: default
aggregationRule:
  roleSelectors: 
  - matchLabels: 
      logs: true
  - matchLabels: 
      read-only: true
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: johndoe
