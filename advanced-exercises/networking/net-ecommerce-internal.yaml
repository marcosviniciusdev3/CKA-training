---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-default-deny
  namespace: ecommerce-internal
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-allow-egress-coredns
  namespace: ecommerce-internal
spec:
  podSelector:
    matchLabels:
      app: backend-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ecommerce-db
      podSelector:
        matchLabels:
          app: secure-db
    ports:
      - protocol: TCP
        port: 5432
  - to:
      - ipBlock:
          cidr: 8.8.8.8/32
    ports:
      - protocol: TCP
        port: 443
