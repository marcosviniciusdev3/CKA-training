apiVersion: v1
kind: Namespace
metadata:
  name: incident-logistics
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: logistics-pv
  labels:
    app: data-logger
spec:
  storageClassName: local-storage
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tmp/logistics-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logistics-data-pvc
  namespace: incident-logistics
spec:
  storageClassName: standard-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: data-logger
  namespace: incident-logistics
  labels:
    app: data-logger
spec:
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "logistics"
      effect: "NoSchedule"
  containers:
    - name: logger
      image: busybox:1.36.1
      command: ["sh", "-c", "while true; do echo $(date) - LOGISTICS_AUDIT_OK >> /var/log/audit/audit.log; sleep 5; done"]
      volumeMounts:
        - name: audit-vol
          mountPath: /var/log/audit
  volumes:
    - name: audit-vol
      persistentVolumeClaim:
        claimName: logistics-data-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: incident-logistics
type: Opaque
stringData:
  AUTH_TOKEN: "Bearer-Token-Prod-Logistics-XYZ99"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-dispatcher
  namespace: incident-logistics
  labels:
    app: order-dispatcher
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-dispatcher
      tier: api
  template:
    metadata:
      labels:
        app: order-dispatcher
        tier: api
    spec:
      nodeSelector:
        tier: worker-processor
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "logistic"
          effect: "NoSchedule"
      containers:
        - name: dispatcher
          image: nginx:1.25.2-alpine
          ports:
            - containerPort: 80
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DB_AUTH_TOKEN
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-svc
  namespace: incident-logistics
  labels:
    app: dispatcher-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: order-dispatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-sa
  namespace: incident-logistics
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-collector
  namespace: incident-logistics
  labels:
    app: metrics-collector
spec:
  serviceAccountName: collector-sa
  containers:
    - name: collector
      image: curlimages/curl:8.5.0
      command:
        - "sh"
        - "-c"
        - |
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          echo "Collector started. Querying Kubernetes API for pods in incident-logistics..."
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" --cacert $CACERT -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/api/v1/namespaces/incident-logistics/pods)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "CRITICAL RBAC ERROR: Kubernetes API returned HTTP $HTTP_CODE"
            cat /tmp/resp.json
            echo ""
            exit 1
          fi
          echo "SUCCESS: Connected to Kubernetes API (HTTP 200). Metrics collector active."
          while true; do
            echo "$(date) - Metrics collector heartbeat: 100% healthy"
            sleep 10
          done
